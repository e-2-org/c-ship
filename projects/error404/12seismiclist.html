<title>Seismic list</title>
<script type="text/javascript" language="JavaScript1.2">
var loadtime = new Date();
var seed = loadtime.valueOf();
function CloseYourself() {
    var closetime = seed + 14500;
    var now = new Date();
    now = now.valueOf();
    if (now > closetime) {
        self.close();
        return;
    }
    setTimeout("CloseYourself()",14501)
}
</script>
</head>
