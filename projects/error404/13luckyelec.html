<script type="text/javascript" language="JavaScript1.2">
function checkEnv(){
	this.ok=(parseInt(navigator.appVersion) >= 4)?1:0;
	this.ns=(navigator.appName == "Netscape" && this.ok)?1:0;
	this.ie=(!this.ns && this.ok)?1:0;
	this.w=screen.width;
	this.h=screen.height;
	this.pady=(this.ns)?(window.outerHeight-window.innerHeight):0;
	this.padx=(this.ns)?(window.outerWidth-window.innerWidth):0;
	this.mac=(navigator.platform.indexOf("Mac")>-1 && this.ok)?1:0;
	this.win=(navigator.platform.indexOf("Win")>-1 && this.ok)?1:0;
	return this;
}
var env = new checkEnv();
function winx(x){
  	if(env.mac){
    	newx=(env.ns)?(x+env.padx):(x+6);
    	return newx;
    }
    else if(env.win){
		newx=(env.ns)?(x+env.padx):(x+3);
		return newx;
	}
	else{
		return x+23;
	}
}
function winy(y){
	if(env.mac){
		newy=(env.ns)?(y+env.pady):(y+26);
		return newy;
	}
	else if(env.win) {
		newy=(env.ns)?(y+env.pady):(y+3);
		return newy;
	}
	else {
		return y+39;
	}
}
function setoptions(wx,wy,sx,sy) {
	var globalopts = "toolbar=no,location=no,directories=no,status=no,scrollbars=no,resizeable=no,copyhistory=no,menubar=no"
	if (env.ns) {
		var opts = globalopts+",width="+wx+",height="+wy+",screenX="+sx+",screenY="+sy;
		return opts;
	}
	else {
		var opts = globalopts+",width="+wx+",height="+wy+",left="+sx+",top="+sy;
		return opts;
	}
}
