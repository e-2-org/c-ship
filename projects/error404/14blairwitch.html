<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 3.2//EN">
<html>
<head>
<title>Blair Witch</title>
<script type="text/javascript" language="JavaScript1.2">
function checkEnv(){
	this.ok=(parseInt(navigator.appVersion) >= 4)?1:0;
	this.ns=(navigator.appName == "Netscape" && this.ok)?1:0;
	this.ie=(!this.ns && this.ok)?1:0;
	this.w=screen.width;
	this.h=screen.height;
	return this;
}
env = new checkEnv();
var w = (env.ns)?window.outerWidth:100;
var h = (env.ns)?window.outerHeight:100;
var x = (env.ns)?window.screenX:env.w-(300);
var y = (env.ns)?window.screenY:20;
function MoveRight() {
  var dx = 1;
  x += dx;
  if (((env.ns) && (x<(env.w-w)))||((env.ie) && (x<env.w))) {
     self.moveTo(x,y);
  }
  else {
     self.close();
  }
  setTimeout("MoveRight();",100);
}
</script>
</head>
<body onload="MoveRight();" topmargin="0" leftmargin="0" marginwidth="0" marginheight="0">
<center><img src="images/blairwitchproject.gif" width="75" height="75" hspace="12" vspace="12" alt="Blair Witch"></center>
</body>
</html>
