<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 3.2//EN">
<html>
<head>
<title>Top navigate</title>
<script type="text/javascript" language="JavaScript1.2">
var loadtime = new Date();
var seed = loadtime.valueOf();
function CloseYourself() {
    var closetime = seed + 16500;
    var now = new Date();
    now = now.valueOf();
    if (now > closetime) {
        self.close();
        return;
    }
    setTimeout("CloseYourself()",16501)
}
</script>
</head>
<body onLoad="CloseYourself();" topmargin="0" leftmargin="0" marginwidth="0" marginheight="0">
<center><img src="images/top_navigate.gif" width="600" height="59" vspace="15" alt="Top navigate"></center>
</body>
</html>
