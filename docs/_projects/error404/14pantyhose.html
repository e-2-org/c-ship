<html>
<head>
<title>Pantyhose</title>
<script type="text/javascript" language="JavaScript1.2">
var loadtime = new Date();
var seed = loadtime.valueOf();
function CloseYourself() {
    var closetime = seed + 36000;
    var now = new Date();
    now = now.valueOf();
    if (now > closetime) {
        self.close();
        return;
    }
    setTimeout("CloseYourself()",36001)
}
</script>
</head>
<body onLoad="CloseYourself();" topmargin="0" leftmargin="0" marginwidth="0" marginheight="0">
