<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN">
<html>
<head>
<title>Saturn</title>
<script type="text/javascript" language="JavaScript1.2">
function checkEnv(){
	this.ok=(parseInt(navigator.appVersion) >= 4)?1:0;
	this.ns=(navigator.appName == "Netscape" && this.ok)?1:0;
	this.ie=(!this.ns && this.ok)?1:0;
	this.w=screen.width;
	this.h=screen.height;
	return this;
}
env = new checkEnv();

var w = (env.ns)?window.outerWidth:400;
var h = (env.ns)?window.outerHeight:173;
var x = (env.ns)?window.screenX:0;
var y = (env.ns)?window.screenY:(env.h-h);
function MoveRight() {
  var dx = 1;
  x += dx;
  if (((env.ns) && (x<(env.w-w)))||((env.ie) && (x<env.w))) {
     self.moveTo(x,y);
  }
  else {
     self.close();
  }
  setTimeout("MoveRight();",100);
}
</script>
</head>
<body onload="MoveRight();" topmargin="0" leftmargin="0" marginwidth="0" marginheight="0">
<img src="images/saturn.jpg" width="400" height="173" alt="Saturn">
</body>
</html>
