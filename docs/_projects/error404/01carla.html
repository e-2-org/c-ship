<script type="text/javascript" language="JavaScript1.2">
function checkEnv(){
	this.ok=(parseInt(navigator.appVersion) >= 4)?1:0;
	this.ns=(navigator.appName == "Netscape" && this.ok)?1:0;
	this.ie=(!this.ns && this.ok)?1:0;
	this.w=screen.width;
	this.h=screen.height;
	this.pady=(this.ns)?(window.outerHeight-window.innerHeight):24;
	this.padx=(this.ns)?(window.outerWidth-window.innerWidth):10;
	return this;
}
env = new checkEnv();
var loadtime = new Date();
var seed = loadtime.valueOf();
var dy = 0, dx = 0;
var rightx=env.w-(env.padx+100);
var bottomy=env.h-(env.pady+120);
var x = rightx, y=0;
self.moveTo(x,y);
window.setInterval("movecarla()", 100)
function movecarla() {
  if ((x >= rightx) && (y < bottomy)) {
    dy = 1;
    y += dy;
    self.moveTo(x,y);
  }
  else if ((y >= bottomy) && (x > 1)) {
    dx = -1;
    x += dx;
    self.moveTo(x,y);
  }
  else if ((x <= 1) && (y >= 1)) {
    dy = -1;
    y += dy;
    self.moveTo(x,y);
  }
  else if ((x < rightx) && (y < 1)) {
    dx = 1;
    x += dx;
    self.moveTo(x,y);
  } 
}
