<script type="text/javascript" language="JavaScript1.2">
function checkEnv(){
	this.ok=(parseInt(navigator.appVersion) >= 4)?1:0;
	this.ns=(navigator.appName == "Netscape" && this.ok)?1:0;
	this.ie=(!this.ns && this.ok)?1:0;
	this.w=screen.width;
	this.h=screen.height;
	return this;
}
env = new checkEnv();
var x=(env.ns)?window.screenX:env.w-640;
var y=(env.ns)?window.screenY:((env.h/2)+50);
var w=(env.ns)?window.outerWidth:640;
var h=(env.ns)?window.outerHeight:290;

function MoveUp() {
  var dy = -1;
  y += dy;
  if ((env.ns && y>1)||(env.ie && y>(-h))) {
     self.moveTo(x,y);
  }
  else {
     self.close();
  }
	setTimeout("MoveUp();",100);
}
</script>
</head>
