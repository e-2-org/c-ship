<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 3.2//EN">
<html>
<head>
<title>Geospider</title>
<script type="text/javascript" language="JavaScript1.2">
function checkEnv(){
	this.ok=(parseInt(navigator.appVersion) >= 4)?1:0;
	this.ns=((navigator.appName == "Netscape") && this.ok)?1:0;
	this.ie=(!this.ns && this.ok)?1:0;
	this.w=screen.width;
	this.h=screen.height;
	return this;
}
env = new checkEnv();
var x = (env.ns)?window.screenX:0;
var y = (env.ns)?window.screenY:0;
var w=(env.ns)?window.outerWidth:400;
var h=(env.ns)?window.outerHeight:229;
function MoveDiag() {
  var dy = 1;
  y += dy;
  if (((env.ns) && (y<(env.h-h)))||((env.ie) && (y<env.h))) {
    if (y<((env.h/2)-h)) {
		  var dx = 1;
  	  x += dx;
		}
		else if ((y>=((env.h/2)-h))&&(x>0)) {
		  dx = -1;
			x += dx;
		}
		else {
		  var dx = 1;
  	  x += dx;
		}
		self.moveTo(x,y);
  }
  else {
     self.close();
  }
	setTimeout("MoveDiag();",100);
}

</script>
</head>
<body topmargin="0" leftmargin="0" marginwidth="0" marginheight="0" onLoad="MoveDiag();">
<center><img src="images/geospider.gif" width="400" height="229" alt="Geospider"></center>
</body>
</html>
