	this.ie=((!this.ns) && this.ok)?1:0;
	this.w=screen.width;
	this.h=screen.height;
	return this;
}
env = new checkEnv();
var x = 0;
var y = 0;
var w=(env.ns)?window.outerWidth:287;
var h=(env.ns)?window.outerHeight:100;

function MoveDown() {
  var dy = 1;
  y += dy;
  if (((env.ns) && (y<(env.h-h)))||((env.ie) && (y<env.h))) {
     self.moveTo(x,y);
  }
  else {
     self.close();
  }
	setTimeout("MoveDown();",100);
}
</script>
