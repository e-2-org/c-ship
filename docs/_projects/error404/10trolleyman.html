<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 3.2//EN">
<html>
<head>
<title>Trolleyman</title>
<script type="text/javascript" language="JavaScript1.2">
function checkEnv(){
	this.ok=(parseInt(navigator.appVersion) >= 4)?1:0;
	this.ns=(navigator.appName == "Netscape" && this.ok)?1:0;
	this.ie=(!this.ns && this.ok)?1:0;
	return this;
}
env = new checkEnv();
var x = (env.ns)?window.screenX:screen.width;
var y = (env.ns)?window.screenY:((screen.height/2)-250);
var w =(env.ns)?window.outerWidth:142;
var h =(env.ns)?window.outerHeight:134;
function MoveLeft() {
  var dx = -1;
  x += dx;
  if (((env.ns) && (x>1))||((env.ie) && (x>-w))) {
     self.moveTo(x,y);
	 self.focus();
  }
  else {
     self.close();
  }
  setTimeout("MoveLeft();",50);
}
</script>
</head>
<body onLoad="MoveLeft();" topmargin="0" leftmargin="0" marginwidth="0" marginheight="0">
<center><img src="images/trolleyman.jpg" width="142" height="134" alt="Trolleyman"></center>
</body>
</html>
