function img_act(imgName) {
    if (document.images) {
        imgOn = eval(imgName + "on.src");
        document[imgName].src = imgOn;
    }
}

function img_inact(imgName) {
    if (document.images) {
        imgOff = eval(imgName + "off.src");
        document[imgName].src = imgOff;
    }
}

function artist_display(imgName) {
    if (document.images) {
        imgOn = eval(imgName+"on.src");
        document[imgName].src = imgOn;
        dispOn = eval(imgName+"disp.src");
        document['display'].src = dispOn;
    }
}

function artist_undisplay(imgName) {
    if (document.images) {
        document[imgName].src = artistoff.src;
        document['display'].src = displayoff.src;
    }
}

function boat_display(imgName) {
    if (document.images) {
        imgOn = eval(imgName+"on.src");
        document[imgName].src = imgOn;
        dispOn = eval(imgName+"dis.src");
        document['boat'].src = dispOn;
    }
}

function boat_undisplay(imgName) {
    if (document.images) {

        document [imgName].src = imgOff;
        document ['boat'].src = boatoff.src;

}
