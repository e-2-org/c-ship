<!doctype html public "-//w3c//dtd html 4.0 transitional//en">
<html>
<head>
<title>14text</title>
<script type="text/javascript" language="JavaScript1.2">
function checkEnv(){
	this.ok=(parseInt(navigator.appVersion) >= 4)?1:0;
	this.ns=((navigator.appName == "Netscape") && this.ok)?1:0;
	this.ie=(!this.ns && this.ok)?1:0;
	this.w=screen.width;
	this.h=screen.height;
	return this;
}
env = new checkEnv();
var x = (env.ns)?window.screenX:(env.w-460);
var y = (env.ns)?window.screenY:(env.h/2);
var w=(env.ns)?window.outerWidth:460;
var h=(env.ns)?window.outerHeight:200;
function MoveDown() {
  var dy = 1;
  y += dy;
  if (((env.ns) && (y<(env.h-h)))||((env.ie) && (y<env.h))) {
     self.moveTo(x,y);
  }
  else {
     self.close();
  }
	setTimeout("MoveDown();",100);
}
</script>
</head>
<body onLoad="MoveDown();">

I did origami. I just recently started again. The biggest peice I ever
did was 78 peices. I learned it from the book Unit Origami.&nbsp; I usually
do normal origami.”</font>
<br>&nbsp;
</body>
</html>
