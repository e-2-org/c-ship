<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 3.2//EN">
<html>
<head>
<title>Daughter2</title>
<script type="text/javascript" language="JavaScript1.2">
function checkEnv(){
	this.ok=(parseInt(navigator.appVersion) >= 4)?1:0;
	this.ns=(navigator.appName == "Netscape" && this.ok)?1:0;
	this.ie=(!this.ns && this.ok)?1:0;
	this.w=screen.width;
	this.h=screen.height;
	return this;
}
env = new checkEnv();

var w = (env.ns)?window.outerWidth:306;
var h = (env.ns)?window.outerHeight:305;
var x = (env.ns)?window.screenX:(env.w/2);
var y = (env.ns)?window.screenY:0;
function MoveRight() {
  var dx = 1;
  x += dx;
  if (((env.ns) && (x<(env.w-w)))||((env.ie) && (x<env.w))) {
     self.moveTo(x,y);
  }
  else {
     self.close();
  }
  setTimeout("MoveRight();",100);
}
</script>
</head>
<body onload="MoveRight();" topmargin="0" leftmargin="0" marginwidth="0" marginheight="0">
<center><img src="images/daughtr2.jpg" width="306" height="305" alt="Daughter2"></center>
</body>
</html>
