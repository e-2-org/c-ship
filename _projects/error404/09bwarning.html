<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 3.2//EN">
<html>
<head>
<title>Warning</title>
<script type="text/javascript" language="JavaScript1.2">
var loadtime = new Date();
var seed = loadtime.valueOf();
function CloseYourself() {
    var closetime = seed + 27000;
    var now = new Date();
    now = now.valueOf();
    if (now > closetime) {
        self.close();
        return;
    }
    setTimeout("CloseYourself()",27001)
}
</script>
</head>
<body onLoad="CloseYourself();" topmargin="0" leftmargin="0" marginwidth="0" marginheight="0" bgcolor="white">
<center><img src="images/bwarning1.gif" width="800" height="73" vspace="13" alt="Warning"></center>
</body>
</html>
