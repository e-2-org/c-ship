<html>
<head>
<title>Venus</title>
<script type="text/javascript" language="JavaScript1.2">
function checkEnv(){
	this.ok=(parseInt(navigator.appVersion) >= 4)?1:0;
	this.ns=((navigator.appName == "Netscape") && this.ok)?1:0;
	this.ie=(!this.ns && this.ok)?1:0;
	this.w=screen.width;
	this.h=screen.height;
	return this;
}
env = new checkEnv();
var x = (env.ns)?window.screenX:258;
var y = (env.ns)?window.screenY:0;
var w=(env.ns)?window.outerWidth:500;
var h=(env.ns)?window.outerHeight:223;
function MoveDown() {
  var dy = 1;
  y += dy;
  if (((env.ns) && (y<(env.h-h)))||((env.ie) && (y<env.h))) {
     self.moveTo(x,y);
  }
  else {
     self.close();
  }
	setTimeout("MoveDown();",100);
}
</script>
</head>
<body onLoad="MoveDown();" topmargin="0" leftmargin="0" marginwidth="0" marginheight="0">
<img src="images/venus.jpg" width="500" height="223" alt="Venus">
</body>
</html>
